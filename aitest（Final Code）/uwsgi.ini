[uwsgi]
#项目目录
chdir=/www/wwwroot/aitest

#指定项目 application
wsgi-file=/www/wwwroot/aitest/app.py

#python 程序内用以启动的 application 变量名
callable=app

# 进程个数
processes=4

# 线程个数
threads=2

#指定启动时的 pid 文件路径（用于停止服务和重启服务，请勿删除）
pidfile=/www/wwwroot/aitest/uwsgi.pid

# 指定 ip 及端口
# 默认 http 模式，可切换至 socket 模式
http=0.0.0.0:5000
#socket=0.0.0.0:5000

#启动 uwsgi 的用户名和用户组
uid=www
gid=www

#启用主进程
master=true

# AI辅助生成：deepseek-v3-2-251201，2026-04-25 关键配置：每个工作进程独立加载应用，避免共享内存冲突
lazy-apps = true

# 设置缓冲区大小
buffer-size = 32768

# 后台运行，并输出日志
daemonize = /www/wwwlogs/python/aitest/uwsgi.log

# 自定义设置项请写到该处，
# 如果项目的启动方式您不想使用 wsgi-file 请注释掉，但不要删除，通讯方式 (http, socket) 同理;
# 最好以上面相同的格式 <注释 + 换行 + key = value> 进行书写，方便以后查阅

