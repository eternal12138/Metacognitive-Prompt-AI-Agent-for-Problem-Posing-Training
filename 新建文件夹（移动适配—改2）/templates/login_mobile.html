<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - AI 思维助手</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f4f7fe; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { width: 85%; background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        .logo-circle { width: 70px; height: 70px; background: #5156be; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; font-size: 30px; }
        h2 { color: #2e384d; margin-bottom: 8px; }
        p { color: #8798ad; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-control { width: 100%; padding: 15px 15px 15px 45px; border-radius: 12px; border: 1px solid #e1e4e8; box-sizing: border-box; font-size: 16px; outline: none; }
        .form-group i { position: absolute; left: 15px; top: 15px; color: #adb5bd; font-size: 18px; }
        .btn-login { width: 100%; padding: 15px; background: #5156be; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; margin-top: 10px; }
        .error-msg { color: #dc3545; background: #fff5f5; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-circle"><i class="fas fa-brain"></i></div>
        <h2>AI 思维助手</h2>
        <p>探索、提问、发现</p>
        
        {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
        
        <form method="POST" action="/">
            <div class="form-group">
                <i class="fas fa-user"></i>
                <input type="text" name="username" class="form-control" placeholder="输入学号" required>
            </div>
            <div class="form-group">
                <i class="fas fa-lock"></i>
                <input type="password" name="user_id" class="form-control" placeholder="输入密码" required>
            </div>
            <button type="submit" class="btn-login">立即登录</button>
        </form>
    </div>
</body>
</html>
